name: Update music manifest

on:
  push:
    paths:
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.ogg'
      - '**/*.m4a'
      - '**/*.flac'
      - '**/*.aac'
      - 'scripts/generate_music_manifest.py'
      - '.github/workflows/update-music-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install metadata reader
        run: python -m pip install mutagen

      - name: Generate manifest
        run: python scripts/generate_music_manifest.py

      - name: Publish manifest
        run: |
          if [ -z "$(git status --porcelain -- music-manifest.json)" ]; then
            echo "Music manifest is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-manifest.json
          git commit -m "Update generated music manifest" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
